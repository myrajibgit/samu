name: Build Offline On-Device LLM Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Clone and Compile llama.cpp for Android ARM64
        run: |
          echo "Cloning llama.cpp..."
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git llama-cpp-src
          cd llama-cpp-src

          mkdir -p build-android-arm64
          cd build-android-arm64

          echo "Compiling libllama.so with Android NDK for ARM64..."
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DBUILD_SHARED_LIBS=ON

          cmake --build . --config Release --target llama -j$(nproc)
          cd ../..

          echo "Copying compiled libllama.so into app jniLibs..."
          mkdir -p app/src/main/jniLibs/arm64-v8a
          find llama-cpp-src/build-android-arm64 -name "libllama.so" -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Grant execute permission for Gradle wrapper
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketLLM-Offline-ARM64-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
